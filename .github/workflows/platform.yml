name: Mellow platform foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and execute portable policy tests
        run: python3 Tools/run-platform-tests.py --cxx g++ --out build/platform-tests
      - name: Backport source intake and negative tests
        run: python3 -m unittest discover -s tests -p test_mellow_port.py -v
      - name: Execute ported Linux Xe algorithms and verify provenance
        run: python3 Tools/run-ported-xe-tests.py --cxx g++ --out build/ported-xe-tests
      - name: Compile native OpenCL provider without requiring a runner GPU
        run: python3 Tools/run-opencl-runtime.py --cxx g++ --out build/opencl-runtime-build
      - name: Check OpenCL lifecycle and injected cleanup failures
        run: python3 Tools/run-opencl-runtime-regressions.py --cxx g++ --out build/opencl-regressions --sanitize
      - name: Check stress timeout and malformed worker reports
        run: python3 tests/opencl_runtime_stress_report_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mellow-platform-host-evidence
          path: |
            build/platform-tests/
            build/ported-xe-tests/
            build/opencl-runtime-build/
            build/opencl-regressions/
          if-no-files-found: error
