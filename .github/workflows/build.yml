name: Build Mellow

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mellow Kext
    runs-on: macos-14
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Lilu
      run: |
        # Download latest Lilu release for compiling dependencies if not present
        if [ ! -d "Lilu.kext" ]; then
          echo "Lilu.kext not found, downloading from Acidanthera..."
          curl -L -o lilu.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-RELEASE.zip
          unzip lilu.zip
          rm lilu.zip
        fi

    - name: Set up MacKernelSDK
      run: |
        # Ensure MacKernelSDK is present (submodule fallback)
        if [ ! -d "MacKernelSDK" ] || [ -z "$(ls -A MacKernelSDK)" ]; then
          echo "MacKernelSDK not initialized, cloning..."
          git submodule update --init --recursive || git clone https://github.com/acidanthera/MacKernelSDK.git MacKernelSDK
        fi

    - name: Validate Source Identity and Metadata
      run: |
        plutil -lint Mellow/Info.plist
        test -f LICENSE
        test -f NOTICE
        test -f LICENSES/Lilu-BSD-3-Clause.txt
        test -f LICENSES/APSL-2.0.txt
        test ! -e Mellow/IGGucBinary.h
        test ! -e Mellow/IGHucBinary.h
        test ! -e Mellow/Firmware.cpp
        test ! -e Mellow/FirmwareADLP.cpp
        ! grep -R -E 'NootedGreen|NGreen|ngreen|NGREEN' Mellow Mellow.xcodeproj

    - name: Build Kext
      run: |
        xcodebuild -project Mellow.xcodeproj -scheme Mellow -configuration Release CONFIGURATION_BUILD_DIR=build/Release

    - name: Verify Kext
      run: |
        test -d build/Release/Mellow.kext
        test -x build/Release/Mellow.kext/Contents/MacOS/Mellow
        bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Release/Mellow.kext/Contents/Info.plist)"
        test "$bundle_id" = "com.NiSeullent.Mellow"

    - name: Compress and Package Kext
      run: |
        cd build/Release
        zip -r Mellow-Release.zip Mellow.kext

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mellow-Release
        path: build/Release/Mellow-Release.zip
